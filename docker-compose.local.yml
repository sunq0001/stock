version: '3.8'

services:
  # InfluxDB 时序数据库
  influxdb:
    image: influxdb:2.0
    container_name: stock-influxdb
    ports:
      - "18086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123456
      - DOCKER_INFLUXDB_INIT_ORG=stock
      - DOCKER_INFLUXDB_INIT_BUCKET=market_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  # Web服务
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "18082:5000"
    environment:
      - PORT=5000
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token
      - INFLUXDB_ORG=stock
      - INFLUXDB_BUCKET=market_data
    volumes:
      - ./html:/app/html
      - ./pe_data_service_influxdb.py:/app/pe_data_service_influxdb.py
    depends_on:
      - influxdb
    command: python pe_data_service_influxdb.py
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./html:/usr/share/nginx/html
    depends_on:
      - web
    restart: unless-stopped

  # 数据采集器（爬取数据并存入InfluxDB）
  crawler:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token
      - INFLUXDB_ORG=stock
      - INFLUXDB_BUCKET=market_data
    volumes:
      - ./html:/app/html
    depends_on:
      - influxdb
    command: python data_collector.py
    restart: unless-stopped

volumes:
  influxdb_data:
